name: customer-support-openenv
short_description: "Customer support agent benchmark with ticket triage and resolution"
description: >
  CustomerSupport OpenEnv is a real-world OpenEnv environment for structured
  customer support agent decisions. An agent receives support tickets and must
  classify, prioritise, draft replies, add internal notes, and resolve issues.
  The final score rewards correct classification, empathetic replies, and
  complete resolution. Dense intermediate rewards guide the agent throughout
  the episode.

author: codebyRohan
version: "1.0.0"
tags:
  - openenv
  - customer-support
  - nlp
  - real-world
  - agent-benchmark

observation_space:
  type: object
  description: >
    Observation includes the customer message, current ticket state,
    conversation history, task description, step count, and metadata
    about what actions have been taken so far.

action_space:
  type: object
  description: >
    The agent may classify the ticket, set priority, draft a reply,
    add an internal note, resolve, or escalate.
  actions:
    - classify
    - set_priority
    - draft_reply
    - add_note
    - resolve
    - escalate

reward:
  description: >
    Dense reward at every step. Correct classification +0.2,
    correct priority +0.2, quality reply up to +0.25,
    internal note +0.1, resolve triggers full grader score (0.001-0.999).
    Penalties for invalid actions and timeout.

tasks:
  - id: task1
    name: "ticket-classification"
    description: >
      Classify a support ticket into the correct category and set
      the appropriate priority level. Tests basic NLU and triage skill.
    difficulty: easy
    max_steps: 4

  - id: task2
    name: "empathetic-reply"
    description: >
      Classify, prioritise, and draft an empathetic reply that
      addresses the customer's concern with a clear timeline and next steps.
    difficulty: medium
    max_steps: 6

  - id: task3
    name: "full-resolution"
    description: >
      Fully resolve a complex ticket — classify, prioritise, reply,
      add an internal note for the team, and close with a resolution
      summary that mentions the specific outcome.
    difficulty: hard
    max_steps: 10
