name: customer-support-env
version: "1.0.0"
description: >
  A real-world customer support agent environment where an AI agent
  processes support tickets by classifying them, setting priority,
  drafting replies, adding internal notes, and resolving issues.
  Rewards partial progress throughout the episode.

author: your-hf-username
tags:
  - openenv
  - customer-support
  - nlp
  - real-world

tasks:
  - id: task1
    difficulty: easy
    description: Classify ticket category and set priority
    max_steps: 4
    score_range: [0.0, 1.0]

  - id: task2
    difficulty: medium
    description: Classify, prioritise, and draft an empathetic reply
    max_steps: 6
    score_range: [0.0, 1.0]

  - id: task3
    difficulty: hard
    description: Full resolution — classify, prioritise, reply, add note, resolve
    max_steps: 10
    score_range: [0.0, 1.0]

action_space:
  type: structured
  actions:
    - classify
    - set_priority
    - draft_reply
    - add_note
    - resolve
    - escalate

observation_space:
  ticket_id: string
  customer_message: string
  category: "enum(billing, technical, shipping, returns, general) | null"
  priority: "enum(low, medium, high) | null"
  conversation_history: "list of {role, content}"
  task_id: string
  task_description: string
  step_number: integer
  done: boolean
  metadata: object

reward:
  type: dense
  range: [-1.0, 1.0]
  description: >
    Partial rewards at each step. Correct classification +0.2,
    correct priority +0.2, quality reply up to +0.25,
    internal note +0.1, resolve triggers full grader score.
    Penalties for invalid actions and max step timeout.

api:
  base_url: http://localhost:7860
  reset: POST /reset?task_id={task_id}
  step: POST /step?task_id={task_id}
  state: GET /state?task_id={task_id}
  tasks: GET /tasks
  health: GET /health
