[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-support-openenv"
version = "1.0.0"
description = "Real-world customer support agent benchmark — an OpenEnv environment"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "codebyRohan" }
]
keywords = ["openenv", "customer-support", "reinforcement-learning", "nlp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "pydantic>=2.0.0",
  "openai>=1.0.0",
  "pyyaml>=6.0",
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "requests>=2.31.0",
  "openenv-core>=0.2.0",
]

[project.scripts]
server = "server.app:main"

[project.urls]
Homepage = "https://huggingface.co/spaces/codebyRohan/customer-support-openenv"
Repository = "https://github.com/rohangangal2007-prog/customer-support-openenv"

[tool.setuptools.packages.find]
where = ["."]
include = ["server*"]

[tool.setuptools.package-data]
server = ["*.yaml", "*.json"]
